<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="24" fill="#F8FAFC"/>
  
  <g transform="translate(200,200) rotate(45) translate(-200,-200)" filter="url(#shadow)">
    <!-- Terminal Stud -->
    <rect x="188" y="45" width="24" height="25" rx="4" fill="url(#metalGrad)"/>
    <circle cx="200" cy="50" r="5" fill="#475569"/>

    <!-- Ceramic Insulator with Ribs -->
    <path d="M185,70 L215,70 L212,175 L188,175 Z" fill="url(#ceramicGrad)"/>
    <!-- Ceramic Ribs -->
    <rect x="182" y="85" width="36" height="8" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="182" y="103" width="36" height="8" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="182" y="121" width="36" height="8" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="182" y="139" width="36" height="8" rx="4" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- NGK Logo Text on Ceramic -->
    <text x="200" y="165" font-family="'Outfit', sans-serif" font-weight="900" font-size="12" fill="#DC2626" text-anchor="middle" letter-spacing="1">NGK</text>

    <!-- Metal Hexagon Body -->
    <path d="M180,175 L220,175 L224,215 L176,215 Z" fill="url(#metalGrad)"/>
    <!-- Hexagon bevels -->
    <line x1="190" y1="175" x2="190" y2="215" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="210" y1="175" x2="210" y2="215" stroke="#475569" stroke-width="2"/>

    <!-- Thread Section (Roscado) -->
    <rect x="182" y="215" width="36" height="90" fill="#334155"/>
    <!-- Thread lines -->
    <g stroke="url(#metalGrad)" stroke-width="3">
      <line x1="180" y1="225" x2="220" y2="225"/>
      <line x1="180" y1="235" x2="220" y2="235"/>
      <line x1="180" y1="245" x2="220" y2="245"/>
      <line x1="180" y1="255" x2="220" y2="255"/>
      <line x1="180" y1="265" x2="220" y2="265"/>
      <line x1="180" y1="275" x2="220" y2="275"/>
      <line x1="180" y1="285" x2="220" y2="285"/>
      <line x1="180" y1="295" x2="220" y2="295"/>
    </g>

    <!-- Base & Gasket (Arandela) -->
    <rect x="176" y="213" width="48" height="6" rx="2" fill="url(#goldGrad)"/>

    <!-- Central Electrode & Ground Electrode -->
    <rect x="196" y="305" width="8" height="22" fill="#E2E8F0"/>
    <!-- Curved Ground Electrode -->
    <path d="M185,305 L185,335 L204,335" fill="none" stroke="url(#metalGrad)" stroke-width="5" stroke-linecap="square"/>
    <!-- Spark Sparkle -->
    <circle cx="200" cy="328" r="3" fill="#38BDF8"/>
  </g>

  <!-- Product badge -->
  <g transform="translate(30, 340)">
    <rect width="130" height="32" rx="6" fill="#0A1931"/>
    <text x="65" y="21" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">NGK D8EA</text>
  </g>
</svg>
