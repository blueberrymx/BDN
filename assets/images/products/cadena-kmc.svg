<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="chainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="chainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="24" fill="#F8FAFC"/>

  <g transform="translate(40, 70)" filter="url(#chainShadow)">
    <!-- Box packaging behind -->
    <rect x="20" y="20" width="280" height="220" rx="12" fill="#0A1931"/>
    <rect x="20" y="20" width="280" height="50" rx="12" fill="#FF5500"/>
    <text x="160" y="52" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">KMC CHAIN</text>
    <text x="160" y="110" font-family="'Outfit', sans-serif" font-weight="800" font-size="18" fill="#FDE047" text-anchor="middle">428H x 132L</text>
    <text x="160" y="135" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#94A3B8" text-anchor="middle">REFORZADA PARA TRABAJO PESADO</text>

    <!-- Metal Chain Links Representation -->
    <g transform="translate(35, 160)">
      <!-- Link 1 -->
      <rect x="0" y="0" width="70" height="34" rx="17" fill="url(#chainGrad)"/>
      <circle cx="17" cy="17" r="7" fill="#0A1931"/>
      <circle cx="53" cy="17" r="7" fill="#0A1931"/>

      <!-- Link 2 -->
      <rect x="40" y="5" width="70" height="24" rx="12" fill="#CBD5E1"/>
      <circle cx="53" cy="17" r="5" fill="#334155"/>
      <circle cx="97" cy="17" r="5" fill="#334155"/>

      <!-- Link 3 -->
      <rect x="80" y="0" width="70" height="34" rx="17" fill="url(#chainGrad)"/>
      <circle cx="97" cy="17" r="7" fill="#0A1931"/>
      <circle cx="133" cy="17" r="7" fill="#0A1931"/>

      <!-- Link 4 -->
      <rect x="120" y="5" width="70" height="24" rx="12" fill="#CBD5E1"/>
      <circle cx="133" cy="17" r="5" fill="#334155"/>
      <circle cx="177" cy="17" r="5" fill="#334155"/>

      <!-- Link 5 -->
      <rect x="160" y="0" width="70" height="34" rx="17" fill="url(#chainGrad)"/>
      <circle cx="177" cy="17" r="7" fill="#0A1931"/>
      <circle cx="213" cy="17" r="7" fill="#0A1931"/>
    </g>
  </g>
</svg>
