<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="40%" stop-color="#EF4444"/>
      <stop offset="80%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1931"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="bottleShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="24" fill="#F8FAFC"/>

  <g transform="translate(40, 15)" filter="url(#bottleShadow)">
    <!-- Bottle Cap -->
    <rect x="135" y="25" width="50" height="26" rx="4" fill="url(#capGrad)"/>
    <line x1="142" y1="25" x2="142" y2="51" stroke="#64748B" stroke-width="2"/>
    <line x1="150" y1="25" x2="150" y2="51" stroke="#64748B" stroke-width="2"/>
    <line x1="160" y1="25" x2="160" y2="51" stroke="#64748B" stroke-width="2"/>
    <line x1="170" y1="25" x2="170" y2="51" stroke="#64748B" stroke-width="2"/>
    <line x1="178" y1="25" x2="178" y2="51" stroke="#64748B" stroke-width="2"/>
    <!-- Safety ring -->
    <rect x="132" y="51" width="56" height="7" rx="2" fill="#334155"/>

    <!-- Bottle Neck -->
    <path d="M136,58 L184,58 L195,100 L125,100 Z" fill="url(#bottleGrad)"/>

    <!-- Bottle Main Body (Industrial ergonomic shape) -->
    <path d="M125,100 Q100,120 95,160 L90,320 Q90,340 115,340 L205,340 Q230,340 230,320 L225,160 Q220,120 195,100 Z" fill="url(#bottleGrad)"/>

    <!-- Side Grip Ribs -->
    <path d="M92,190 L85,200 L85,280 L92,290" fill="none" stroke="#7F1D1D" stroke-width="4"/>
    <line x1="86" y1="220" x2="94" y2="220" stroke="#7F1D1D" stroke-width="2.5"/>
    <line x1="86" y1="240" x2="94" y2="240" stroke="#7F1D1D" stroke-width="2.5"/>
    <line x1="86" y1="260" x2="94" y2="260" stroke="#7F1D1D" stroke-width="2.5"/>

    <!-- Bottle Highlight Reflection -->
    <path d="M106,125 L106,325" stroke="#FCA5A5" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Front Label -->
    <rect x="108" y="145" width="104" height="165" rx="8" fill="url(#labelGrad)"/>
    <rect x="108" y="145" width="104" height="165" rx="8" fill="none" stroke="#F59E0B" stroke-width="2"/>

    <!-- AKRON Brand on Label -->
    <text x="160" y="175" font-family="'Outfit', sans-serif" font-weight="900" font-size="19" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AKRON</text>
    
    <!-- Gold decorative bar -->
    <rect x="118" y="185" width="84" height="3" fill="#F59E0B"/>

    <!-- 4T Badge -->
    <circle cx="160" cy="216" r="22" fill="#FF5500"/>
    <text x="160" y="223" font-family="'Outfit', sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">4T</text>

    <!-- Viscosity & Type -->
    <text x="160" y="258" font-family="'Outfit', sans-serif" font-weight="900" font-size="14" fill="#FDE047" text-anchor="middle">20W-50</text>
    <text x="160" y="275" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#E2E8F0" text-anchor="middle" letter-spacing="0.5">MINERAL MULTIGRADO</text>
    <text x="160" y="295" font-family="'Inter', sans-serif" font-weight="600" font-size="8.5" fill="#94A3B8" text-anchor="middle">CONT. NET. 946 ml</text>
  </g>
</svg>
